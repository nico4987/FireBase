<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Refugio de Mascotas</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Refugio de Mascotas - Nicolás Ingelhorn</h1>
    
    <div id="formulario">
        <input type="text" id="codigo" placeholder="Código (Identificador Único)">
        <input type="text" id="nombre" placeholder="Nombre de la mascota">
        <input type="text" id="especie" placeholder="Especie (Ej: Perro, Gato)">
        <input type="number" id="edad" placeholder="Edad">
        <input type="text" id="raza" placeholder="Raza">
        
        <button id="btnGuardar">Guardar Mascota</button>
    </div>

    <div id="mensaje"></div>
    <div id="lista"></div>

    <script type="module" src="index.js"></script>
</body>
</html>
