<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Refugio - Etapa 1 y 2</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Refugio de Mascotas-Nicolás Ingelhorn</h1>
    
    <div id="formulario">
        <input type="text" id="codigo" placeholder="Código">
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="especie" placeholder="Especie">
        <input type="number" id="edad" placeholder="Edad">
        <input type="text" id="raza" placeholder="Raza">
        <button id="btnGuardar">Guardar Datos</button>
    </div>
    
    <div id="mensaje"></div>

    <h2>Mascotas Registradas</h2>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Especie(De Animal)</th>
                <th>Edad</th>
                <th>Raza</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <script type="module" src="index.js"></script>
</body>
</html>
